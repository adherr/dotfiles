[tools]
node = "lts"
ruby = "4"
# Required by Emacs' prettier.el, which requires the npm module directly
# rather than shelling out to a `prettier` binary (see init.el).
prettier = "3"
"npm:@earendil-works/pi-coding-agent" = "latest"

[tasks."emacs-packages-update"]
description = "Pull and rebuild all straight.el packages (restart Emacs and verify before freezing)"
run = "{{env.HOME}}/dotfiles/bin/emacs-packages-update"

[tasks."emacs-packages-freeze"]
description = "Pin straight.el package versions to the lockfile, once verified healthy"
run = "{{env.HOME}}/dotfiles/bin/emacs-packages-freeze"

[tasks."emacs-packages-thaw"]
description = "Reset straight.el packages to the lockfile and rebuild (restart Emacs after)"
run = "{{env.HOME}}/dotfiles/bin/emacs-packages-thaw"

[settings]
experimental = true
