# Prefix: F5 instead of C-b — avoids Emacs/readline chords, and F5 is
# explicitly reserved as user-free in the Emacs manual (F1-F4/F10 are bound).
unbind C-b
set -g prefix F5
bind F5 send-prefix

set -g default-shell /opt/homebrew/bin/fish
set -g mouse on
set -g focus-events on
set -g set-titles on

# forward cursor-color (OSC 12) and cursor-shape (DECSCUSR) escapes to
# Ghostty; tmux swallows these by default, which leaves the terminal's
# own dim default cursor instead of Emacs's theme cursor color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc:Cs=\E]12;%p1%s\007:Cr=\E]112\007:Ss=\E[%p1%d q:Se=\E[2 q"
set -ga update-environment " COLORTERM TERM_PROGRAM"
# forward OSC 52 clipboard writes and Kitty graphics protocol (images) to
# Ghostty instead of tmux swallowing them
set -g set-clipboard on
set -g allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1

set -g status-style bg=default
set -g status-left ""
set -g status-right "#S"
setw -g window-status-current-style bold

bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g escape-time 0

# let Ghostty's Kitty keyboard protocol through, so terminal Emacs can tell C-' apart from bare '
set -g extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'
