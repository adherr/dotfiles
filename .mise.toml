[tasks.init]
description = "Record this machine's role (pass -- --role full|client) and pin this repo's commit email. Run first on a new machine"
run = "bin/init"

[tasks.bootstrap]
description = "New-machine setup for this machine's role: link, brew bundle (Brewfile or Brewfile.client), mise install, macos. Extra args go to the macos task"
run = "bin/bootstrap"

[tasks."brewfile-dump"]
description = "Regenerate Brewfile from installed packages (full machines only) and check Brewfile.client is still a subset"
run = "bin/brewfile-dump"

[tasks.link]
description = "Symlink dotfiles from ./home into $HOME"
run = "bin/link"

[tasks.unlink]
description = "Remove dotfiles symlinks from $HOME"
run = "bin/unlink"

[tasks.macos]
description = "Run every macOS-only setup script for this machine's role (macos-defaults, ghostty-terminfo-install, plexmono-install; full machines also get tableplus-defaults, cups-defaults). Pass --with-ssh-keys to also run ssh-keys-new-machine, --with-printers to also add the home-LAN network printers"
run = "bin/macos"

[tasks.tableplus-defaults]
description = "Disable TablePlus auto-update checks"
run = "bin/tableplus-defaults"

[tasks.macos-defaults]
description = "Restore macOS keyboard shortcut / function-key defaults"
run = "bin/macos-defaults"

[tasks."cups-defaults"]
description = "Enable the CUPS web admin interface (http://localhost:631). Pass --with-printers to also add the home-LAN network printers"
run = "bin/cups-defaults"

[tasks."ssh-keys-new-machine"]
description = "Generate per-machine SSH auth + signing keys (1Password if available, else local passphrase-protected keys in the macOS keychain), register with GitHub, write ~/.gitconfig.local"
run = "bin/ssh-keys-new-machine"

[tasks."plexmono-install"]
description = "Install the ligatured PlexMono font (PlexMono submodule) into ~/Library/Fonts"
run = "bin/plexmono-install"

[tasks."arch-install"]
description = "Install pinned packages on Arch via paru (pacman.txt)"
run = "bin/arch-install"

[tasks."ghostty-terminfo-install"]
description = "Install Ghostty's terminfo entry into ~/.terminfo"
run = "bin/ghostty-terminfo-install"
